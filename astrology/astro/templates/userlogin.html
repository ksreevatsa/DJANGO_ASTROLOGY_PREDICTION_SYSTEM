{% extends 'base.html' %}
{% block content %}
<div class="full-vh-container">
    <div class="card-modern form-card-compact fade-in-up">
        {% if message %}
        <div class="alert-modern alert-error text-center">
            <i class="fas fa-exclamation-triangle"></i> {{ message }}
        </div>
        {% endif %}
        
        <h2 class="heading-modern">
            <i class="fas fa-sign-in-alt"></i> User Login
        </h2>
        
        <form method="post" action="{% url 'userlogin' %}" class="form-modern">
            {% csrf_token %}
            
            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-user"></i> Username
                </label>
                <input type="text" name="uname" class="form-control" required 
                       placeholder="Enter your username">
            </div>
            
            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-lock"></i> Password
                </label>
                <input type="password" name="pwd" class="form-control" required 
                       placeholder="Enter your password">
            </div>
            
            <div class="text-center">
                <button type="submit" class="btn-modern">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
                <button type="reset" class="btn-modern btn-secondary">
                    <i class="fas fa-undo"></i> Clear
                </button>
            </div>
        </form>
        
        <div class="text-center" style="margin-top: 20px;">
            <p class="text-modern">
                Don't have an account? 
                <a href="/register" class="btn-modern" style="padding: 8px 16px; font-size: 14px;">
                    <i class="fas fa-user-plus"></i> Register Here
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
